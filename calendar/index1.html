<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12382f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>کارت تقویم روزانه</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  body{font-family:Vazirmatn,Tahoma,sans-serif;margin:0;background:#eef1ee;color:#12382f;-webkit-text-size-adjust:100%;padding-bottom:env(safe-area-inset-bottom)}
  .wrap{max-width:900px;margin:0 auto;padding:16px;box-sizing:border-box}
  h1{font-size:20px;margin:8px 0 14px}
  .panel{display:flex;flex-wrap:wrap;gap:10px;align-items:end;background:#fff;padding:12px;border-radius:12px;margin-bottom:14px}
  label{display:flex;flex-direction:column;font-size:13px;gap:4px}
  input,select,button{font-family:inherit;font-size:14px;padding:9px 10px;border-radius:8px;border:1px solid #9bb;box-sizing:border-box}
  select{background:#fff;color:#12382f;min-width:72px}
  input[type=file]{max-width:100%}
  button{min-height:42px}
  @media(max-width:600px){.wrap{padding:10px}.panel{gap:8px;padding:10px}.panel>label,.panel>button{width:100%}.panel label span{width:100%}.panel select{flex:1;min-width:0}.panel input[type=number]{width:100%!important}.panel button{width:100%}h1{font-size:18px}canvas{border-radius:10px}.panel details{width:100%}}
  button{background:#12382f;color:#fff;border:0;cursor:pointer}
  button.alt{background:#fff;color:#12382f;border:1px solid #12382f}
  canvas{width:100%;height:auto;border-radius:12px;box-shadow:0 2px 12px #0003;background:#fff}
  small{color:#567}
</style>

<style>
:root{--green:#12382f;--gold:#b58a4a;--cream:#fbf8ef}
*{box-sizing:border-box} body{background:linear-gradient(145deg,#eaf1ed,#f7f2e8);min-height:100vh} .wrap{max-width:760px;padding:14px 12px 32px}
.hero{background:linear-gradient(135deg,#12382f,#1d5a4b);color:#fff;border-radius:22px;padding:20px 18px;margin-bottom:14px;box-shadow:0 10px 30px #12382f22}.hero h1{font-size:23px;margin:0 0 6px}.hero p{margin:0;opacity:.88;font-size:13px}
.panel{border:1px solid #dfe7e2;box-shadow:0 6px 20px #12382f12}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}.controls .wide{grid-column:1/-1}.controls label{min-width:0}.date-row{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:6px}.date-row select{width:100%} input,select,button{min-height:46px;border-radius:12px} input[type=file]{padding:10px 8px;background:#fff}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.actions button{font-weight:700}.primary{background:var(--green)}.share{background:#5b7c3a!important}.canvas-wrap{padding:8px;background:#ffffffaa;border-radius:18px}.canvas-wrap canvas{display:block}.hint{font-size:12px;line-height:1.8}.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.quick button{min-height:40px;padding:6px 12px}.status{font-size:12px;color:#456;text-align:center;min-height:20px;margin:8px 0}.footer-note{text-align:center;color:#567;font-size:12px;margin-top:12px}@media(max-width:520px){.controls{grid-template-columns:1fr}.controls .wide{grid-column:auto}.actions{grid-template-columns:1fr 1fr}.hero{padding:17px 15px}.hero h1{font-size:20px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero"><h1>تقویم روزانه دیار قدمگاه</h1><p>ساخت و اشتراک‌گذاری سریع کارت تقویم برای گروه و کانال</p></div>
  <div class="panel controls">
    <label class="wide">تاریخ شمسی<span class="date-row"><select id="jd"></select><select id="jm"></select><select id="jy"></select></span></label>
    <label>عکس پس‌زمینه<input type="file" id="img" accept="image/jpeg,image/png"></label>
    <label>لوگو (اختیاری)<input type="file" id="logoInput" accept="image/jpeg,image/png"></label>
    <label>نام گروه (اختیاری)<input type="text" id="groupName" maxlength="80" placeholder="نام گروه را وارد کنید"></label>
    <label>اصلاح تاریخ قمری (روز)<input type="number" id="off" value="0" min="-2" max="2" style="width:90px"></label>
    <div class="actions wide"><button id="dl" class="primary">⬇️ دانلود PNG</button><button id="share" class="share">📤 اشتراک‌گذاری</button></div>
    <label>تعداد روز (برای ZIP)<input type="number" id="n" value="7" min="1" max="366" style="width:90px"></label>
    <button id="zip" class="alt">دانلود ZIP از این روز به بعد</button>
  </div>
  <div class="canvas-wrap"><canvas id="c" width="1280" height="1290"></canvas></div>
  <details class="panel" style="display:block;margin-top:14px" open>
    <summary style="cursor:pointer;font-weight:700">ویرایش ذکر روزهای هفته</summary>
    <div id="dh" style="display:grid;gap:10px;margin-top:12px"></div>
    <button id="reset" class="alt" style="margin-top:12px">بازگشت به پیش‌فرض</button>
  </details>
  <div class="quick"><button class="alt" id="today">امروز</button><button class="alt" id="tomorrow">فردا</button></div><p class="hint">اگر تاریخ قمری با تقویم رسمی ایران اختلاف داشت، مقدار «اصلاح تاریخ قمری» را ۱+ یا ۱- تنظیم کنید.</p><div id="status" class="status"></div><div class="footer-note">گروه دیار قدمگاه 🌿</div>
</div>

function parts(date,cal){
  const p=new Intl.DateTimeFormat('en-US-u-ca-'+cal+'-nu-latn',{day:'numeric',month:'numeric',year:'numeric',timeZone:'UTC'}).formatToParts(date);
  const g=t=>+p.find(x=>x.type===t).value.replace(/\D/g,'');
  return {d:g('day'),m:g('month'),y:g('year')};
}
function info(y,m,d,off){
  const dt=new Date(Date.UTC(y,m-1,d,12));
  const hj=new Date(dt.getTime()+off*864e5);
  const s=parts(dt,'persian'),h=parts(hj,'islamic-umalqura');
  return {wd:dt.getUTCDay(),s,h,g:{d,m,y}};
}

  if(days>365){gy+=~~((days-1)/365);days=(days-1)%365;}
  let gd=days+1;
  const sa=[0,31,((gy%4==0&&gy%100!=0)||(gy%400==0))?29:28,31,30,31,30,31,31,30,31,30,31];
  let gm=0;for(;gm<13&&gd>sa[gm];gm++)gd-=sa[gm];
  return [gy,gm,gd];
}
function getG(){
  let jy=+jyS.value,jm=+jmS.value,jd=+jdS.value;
  for(;jd>=1;jd--){
    const [y,m,d]=j2g(jy,jm,jd);
    const s=parts(new Date(Date.UTC(y,m-1,d,12)),'persian');
    if(s.d==jd&&s.m==jm)return [y,m,d];
  }
  return [2026,1,1];
}
function cur(){const [y,m,d]=getG();return info(y,m,d,+offEl.value||0);}
function render(){draw(cur());}
(function(){
  const now=new Date(),s=parts(new Date(Date.UTC(now.getFullYear(),now.getMonth(),now.getDate(),12)),'persian');
  for(let i=1;i<=31;i++)jdS.add(new Option(fa(i),i));
  FA_M.forEach((n,i)=>jmS.add(new Option(n,i+1)));
  for(let y=1400;y<=1430;y++)jyS.add(new Option(fa(y),y));
  jdS.value=s.d;jmS.value=s.m;jyS.value=s.y;
})();
jdS.onchange=jmS.onchange=jyS.onchange=offEl.onchange=render;
document.getElementById('img').onchange=e=>{
  const inp=e.target,f=inp.files&&inp.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onerror=()=>alert('خواندن فایل ممکن نشد. یه عکس JPG یا PNG انتخاب کن.');
  rd.onload=()=>{
    const im=new Image();
    im.onerror=()=>alert('این فرمت عکس پشتیبانی نمی‌شه (مثلاً HEIC). لطفاً عکس JPG یا PNG انتخاب کن.');
    im.onload=()=>{
      const s=Math.min(1,1600/Math.max(im.naturalWidth,im.naturalHeight));
      const c=document.createElement('canvas');
      c.width=Math.round(im.naturalWidth*s);c.height=Math.round(im.naturalHeight*s);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      bg=c;render();inp.value='';
    };
    im.src=rd.result;
  };
  rd.readAsDataURL(f);
};
document.getElementById('logoInput').onchange=e=>{
  const inp=e.target,f=inp.files&&inp.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onerror=()=>alert('خواندن فایل لوگو ممکن نشد. لطفاً JPG یا PNG انتخاب کن.');
  rd.onload=()=>{
    customLogo.onload=()=>{customLogoReady=true;render();};
    customLogo.onerror=()=>{customLogoReady=false;alert('این فرمت لوگو پشتیبانی نمی‌شه. لطفاً JPG یا PNG انتخاب کن.');render();};
    customLogo.src=rd.result;
  };
  rd.readAsDataURL(f);
};
document.getElementById('groupName').oninput=render;
function save(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();}
const blobOf=()=>new Promise((r,j)=>cv.toBlob(b=>b?r(b):j(new Error('PNG generation failed')),'image/png'));
document.getElementById('dl').onclick=async()=>{await draw(cur());const s=cur().s;save(await blobOf(),`calendar-${s.y}-${String(s.m).padStart(2,'0')}-${String(s.d).padStart(2,'0')}.png`);};
document.getElementById('zip').onclick=async()=>{
  const n=+document.getElementById('n').value||1;const [y,m,d]=getG();
  const z=new JSZip();
  for(let k=0;k<n;k++){
    const dt=new Date(Date.UTC(y,m-1,d+k,12));
    const inf=info(dt.getUTCFullYear(),dt.getUTCMonth()+1,dt.getUTCDate(),+offEl.value||0);
    await draw(inf);
    z.file(`${inf.s.y}-${String(inf.s.m).padStart(2,'0')}-${String(inf.s.d).padStart(2,'0')}.png`,await blobOf());
  }
  save(await z.generateAsync({type:'blob'}),'calendar-cards.zip');
  render();
};
const dh=document.getElementById('dh');
function saveD(){try{localStorage.setItem('dhikr',JSON.stringify(DHIKR));}catch(e){}}
function buildEditor(){
  dh.innerHTML='';
  [6,0,1,2,3,4,5].forEach(w=>{
    const box=document.createElement('div');
    box.style.cssText='display:grid;gap:6px;border:1px solid #cdd;border-radius:10px;padding:10px';
    box.innerHTML=`<b>${WD[w]}</b>`;
    [0,1].forEach(k=>{
      const inp=document.createElement('input');
      inp.value=DHIKR[w][k];inp.placeholder=k?'ترجمه':'متن ذکر';
      inp.dir='rtl';
      inp.oninput=()=>{DHIKR[w][k]=inp.value;saveD();render();};
      box.appendChild(inp);
    });
    dh.appendChild(box);
  });
}
document.getElementById('reset').onclick=()=>{DHIKR.splice(0,7,...DEF.map(x=>x.slice()));saveD();buildEditor();render();};
buildEditor();
document.getElementById('today').onclick=()=>{const now=new Date(),s=parts(new Date(Date.UTC(now.getFullYear(),now.getMonth(),now.getDate(),12)),'persian');jdS.value=s.d;jmS.value=s.m;jyS.value=s.y;render();};
document.getElementById('tomorrow').onclick=()=>{const now=new Date();now.setDate(now.getDate()+1);const s=parts(new Date(Date.UTC(now.getFullYear(),now.getMonth(),now.getDate(),12)),'persian');jdS.value=s.d;jmS.value=s.m;jyS.value=s.y;render();};
async function makePNG(){await draw(cur());return await blobOf();}
document.getElementById('share').onclick=async()=>{try{const blob=await makePNG(),s=cur().s,file=new File([blob],`calendar-${s.y}-${String(s.m).padStart(2,'0')}-${String(s.d).padStart(2,'0')}.png`,{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({title:'تقویم روزانه دیار قدمگاه',text:'کارت تقویم روزانه',files:[file]});}else{save(blob,file.name);document.getElementById('status').textContent='اشتراک‌گذاری مستقیم در این مرورگر پشتیبانی نمی‌شود؛ فایل PNG دانلود شد.';}}catch(e){if(e.name!=='AbortError')document.getElementById('status').textContent='اشتراک‌گذاری انجام نشد.';}};
document.fonts.ready.then(render);
</script>
