<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>عیب‌یابی</title></head>
<body style="font-family:monospace;padding:12px;background:#111;color:#0f0;font-size:13px;line-height:1.6">
<h2 style="color:#ff0">عیب‌یابی قالب‌ها</h2>
<div id="out">در حال بارگذاری...</div>
<script>
const log = [];
function add(msg) { log.push(msg); document.getElementById('out').innerHTML = '<pre style="white-space:pre-wrap;direction:ltr;text-align:left">' + log.join('\n') + '</pre>'; }
window.addEventListener('error', e => {
  add('✗ ERROR: ' + e.message + ' @ ' + (e.filename||'').split('/').pop() + ':' + e.lineno);
});
</script>
<script src="js/registry.js"></script>
<script src="js/hijri.js"></script>
<script src="js/shared.js"></script>
<script src="js/themed.js"></script>
<script src="js/events.js"></script>
<script>add('libs: TEMPLATE_LIST=' + (window.TEMPLATE_LIST ? TEMPLATE_LIST.length : 'undef') + ' | registerTemplate=' + (typeof registerTemplate) + ' | drawPhoneInline=' + (typeof drawPhoneInline) + ' | getNoteStyle=' + (typeof getNoteStyle));</script>

<script src="js/templates/royal.js"></script>
<script>add('royal: ' + (window.TEMPLATES && TEMPLATES.royal ? '✓ OK' : '✗ FAILED'));</script>

<script>
add('');
add('=== نتیجه نهایی ===');
add('ثبت‌شده: ' + (window.TEMPLATES ? Object.keys(TEMPLATES).length : 0) + ' قالب');
add('لیست: ' + (window.TEMPLATES ? Object.keys(TEMPLATES).join(', ') : '—'));
