<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>نوار اخبار فوری دیار قدمگاه</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}


body{

background:transparent;
font-family:tahoma,Arial,sans-serif;
direction:rtl;

}


.news-ticker{

width:100%;
height:45px;
background:#b00000;
color:white;
display:flex;
align-items:center;
overflow:hidden;
border-radius:8px;

}



/* عنوان ثابت */

.ticker-title{

height:100%;
background:#800000;
display:flex;
align-items:center;
padding:0 15px;
font-size:14px;
font-weight:bold;
white-space:nowrap;
z-index:10;

}


.blink{

color:#ffd700;
margin-left:8px;
animation:blink 1s infinite;

}




/* محل حرکت */

.ticker-box{

flex:1;
height:100%;
overflow:hidden;
position:relative;

}



/* متن اخبار */

.ticker-content{

position:absolute;
right:0;
height:100%;

display:flex;
align-items:center;

white-space:nowrap;

/* مقدار پیش‌فرض؛ بعد از دریافت اخبار توسط جاوااسکریپت با سرعت
   ثابت و خوانا (بر اساس طول واقعی محتوا) بازمحاسبه می‌شود */
animation:newsMove 200s linear infinite;

}



.news-item{

color:white;
font-size:14px;
padding:0 45px;
text-decoration:none;
display:inline-block;

}

.news-item:hover{

text-decoration:underline;

}


.news-source{

color:#ffd700;
font-weight:bold;

}



.separator{

color:#ffd700;

}




/* حرکت خبر
شروع با مکث کوتاه
سپس حرکت راست به چپ
*/

@keyframes newsMove{


0%{

transform:translateX(0);

}


100%{

transform:translateX(100%);

}


}




@keyframes blink{

50%{

opacity:.25;

}

}



.ticker-content:hover{

animation-play-state:paused;

}




@media(max-width:600px){

.ticker-title{

font-size:12px;
padding:0 10px;

}


.news-item{

font-size:12px;
padding:0 25px;

}

}


</style>

</head>


<body>


<div class="news-ticker">


<div class="ticker-title" id="tickerToggle" style="cursor:pointer;user-select:none;" title="برای توقف/ادامه‌ی حرکت ضربه بزنید">

<span class="blink" id="tickerToggleIcon">🔴</span>

خبر فوری

</div>



<div class="ticker-box">


<div id="tickerContent" class="ticker-content">

در حال دریافت اخبار...

</div>


</div>


</div>




<script>

const url =
"https://raw.githubusercontent.com/diyareghadamgah/diyar-widgets/main/diyar-news/news.json";


// جلوگیری از XSS: عنوان خبر پیش از درج در HTML باید escape شود،
// چون از news.json (یعنی از منابع RSS خارجی) به‌صورت خام می‌آید.
function escapeHtml(str) {
if (str === null || str === undefined) return "";
return String(str)
.replace(/&/g, "&amp;")
.replace(/</g, "&lt;")
.replace(/>/g, "&gt;")
.replace(/"/g, "&quot;")
.replace(/'/g, "&#039;");
}

// اعتبارسنجی امن لینک خبر: فقط آدرس‌های http/https معتبر پذیرفته
// می‌شوند؛ یک بررسی ساده مثل startsWith("http") قابل دور زدن است
// (مثلاً با یک لینک حاوی کاراکترهای خطرناک HTML مانند نقل‌قول و تگ)
function safeLink(link) {
try {
var u = new URL(link, window.location.href);
if (u.protocol === "http:" || u.protocol === "https:") return u.href;
} catch (e) {}
return "#";
}

// سرعت روان و حرفه‌ای نوار اخبار: به‌جای یک عدد ثابت برای مدت‌زمان
// انیمیشن (که با تغییر تعداد اخبار خیلی سریع یا خیلی کند می‌شود)،
// سرعت به‌صورت پیکسل-بر-ثانیه ثابت نگه داشته می‌شود؛ یعنی صرف نظر
// از تعداد خبرها، حرکت همیشه با یک آهنگ آرام و خوانا انجام می‌شود.
var PIXELS_PER_SECOND = 40; // عدد کمتر = حرکت کندتر و خواناتر
var MIN_DURATION_SECONDS = 60; // حداقل مدت، حتی وقتی خبر کم است

fetch(url + "?v=" + Date.now())

.then(response => response.json())

.then(data => {

let html = "";


(data.news || []).slice(0,40).forEach(item => {

if(item.title){

const href = safeLink(item.link);

const sourceLabel = item.source ? `<span class="news-source">${item.flag ? escapeHtml(item.flag) + ' ' : ''}${escapeHtml(item.source)}:</span> ` : '';

html += `

<a class="news-item" href="${href}" target="_blank" rel="noopener noreferrer">
🔹 ${sourceLabel}${escapeHtml(item.title)}
</a>

<span class="separator">
◆
</span>

`;

}

});


const ticker = document.getElementById("tickerContent");


if(html){

ticker.innerHTML = html + html;

// بازنشانی حرکت برای اجرای روان بعد از آپدیت، با سرعت ثابت
// (بر اساس عرض واقعی محتوای تازه ساخته‌شده)
ticker.style.animation = "none";

setTimeout(() => {

const contentWidth = ticker.scrollWidth;
const duration = Math.max(MIN_DURATION_SECONDS, Math.round(contentWidth / PIXELS_PER_SECOND));

ticker.style.animation = `newsMove ${duration}s linear infinite`;

}, 50);


}

})


.catch(() => {

document.getElementById("tickerContent").innerHTML =

`
<span class="news-item">
اخبار در حال بروزرسانی است
</span>
`;

});


// توقف/ادامه‌ی حرکت با ضربه (تپ) روی دکمه‌ی «خبر فوری»؛
// چون حرکت با هاور روی موبایل کار نمی‌کند، این یک راه جایگزین
// برای لمسی‌هاست تا کاربر بتواند یک خبر را نگه دارد و بخواند.
(function(){

var toggleBtn = document.getElementById("tickerToggle");
var toggleIcon = document.getElementById("tickerToggleIcon");
var tickerEl = document.getElementById("tickerContent");
var paused = false;

toggleBtn.addEventListener("click", function(){

paused = !paused;

tickerEl.style.animationPlayState = paused ? "paused" : "running";
toggleIcon.textContent = paused ? "⏸" : "🔴";
toggleBtn.title = paused ? "برای ادامه‌ی حرکت ضربه بزنید" : "برای توقف حرکت ضربه بزنید";

});

})();


</script>



</body>

</html>
