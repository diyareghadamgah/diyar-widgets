<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>پلیر موزیک پیشرفته</title>

    <!-- SEO & Meta -->
    <meta name="description" content="پلیر موزیک پیشرفته با طراحی شیشه‌ای، پشتیبانی از PWA و پخش پس‌زمینه" />
    <meta name="theme-color" content="#0f0f1a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Open Graph -->
    <meta property="og:title" content="پلیر موزیک" />
    <meta property="og:description" content="پلیر موزیک پیشرفته با طراحی شیشه‌ای" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="" />
    <meta property="og:image" content="icons/icon-512.png" />

    <!-- Manifest -->
    <link rel="manifest" href="manifest.json" />

    <!-- Icons -->
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png" />

    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <!-- Main App -->
    <div id="app" role="application" aria-label="پلیر موزیک">

        <!-- Navigation -->
        <nav class="nav" role="navigation" aria-label="ناوبری اصلی">
            <span class="nav-title">🎵 پلیر</span>
            <div class="nav-actions">
                <button class="nav-btn" id="favoritesBtn" aria-label="لیست علاقه‌مندی‌ها" title="علاقه‌مندی‌ها">
                    ♥
                    <span class="badge" id="favCount">0</span>
                </button>
                <button class="nav-btn" id="playlistToggle" aria-label="نمایش لیست پخش" title="لیست پخش">
                    ☰
                </button>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="main-content" id="mainContent">

            <!-- Album Art -->
            <section class="album-wrapper" aria-label="جلد آلبوم">
                <div class="album-ring" id="albumRing">
                    <div class="album-ring-inner">
                        <img id="albumCover" src="covers/c.png" alt="جلد آلبوم" loading="lazy" />
                    </div>
                </div>
                <!-- Equalizer overlay -->
                <div class="eq-overlay" id="eqOverlay">
                    <span class="eq-bar"></span>
                    <span class="eq-bar"></span>
                    <span class="eq-bar"></span>
                    <span class="eq-bar"></span>
                    <span class="eq-bar"></span>
                    <span class="eq-bar"></span>
                    <span class="eq-bar"></span>
                    <span class="eq-bar"></span>
                </div>
            </section>

            <!-- Song Info -->
            <section class="song-info" aria-label="اطلاعات آهنگ">
                <h2 class="song-title" id="songTitle">عنوان آهنگ</h2>
                <p class="song-artist" id="songArtist">نام خواننده</p>
            </section>

            <!-- Progress -->
            <section class="progress-area" aria-label="نوار پیشرفت">
                <div class="progress-bar" id="progressBar" role="slider" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="موقعیت پخش">
                    <div class="progress-fill" id="progressFill" style="width:0%"></div>
                </div>
                <div class="progress-times">
                    <span id="currentTime">0:00</span>
                    <span id="duration">0:00</span>
                </div>
            </section>

            <!-- Controls -->
            <section class="controls" aria-label="کنترل‌های پخش">
                <button class="ctrl-btn" id="shuffleBtn" aria-label="تصادفی" title="تصادفی">🔀</button>
                <button class="ctrl-btn" id="prevBtn" aria-label="قبلی" title="قبلی">⏮</button>
                <button class="ctrl-btn play-btn" id="playBtn" aria-label="پخش / توقف" title="پخش">▶</button>
                <button class="ctrl-btn" id="nextBtn" aria-label="بعدی" title="بعدی">⏭</button>
                <button class="ctrl-btn" id="repeatBtn" aria-label="تکرار" title="تکرار">🔁</button>
            </section>

            <!-- Volume -->
            <section class="volume-area" aria-label="کنترل صدا">
                <button class="volume-icon" id="muteBtn" aria-label="بی‌صدا" title="بی‌صدا">🔊</button>
                <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.01" value="0.8" aria-label="بلندی صدا" />
            </section>

            <!-- Playlist Drawer (hidden by default) -->
            <aside class="playlist-drawer" id="playlistDrawer" role="complementary" aria-label="لیست پخش">
                <div class="playlist-header">
                    <span>📋 لیست پخش</span>
                    <button class="close-playlist" id="closePlaylist" aria-label="بستن لیست">✕</button>
                </div>
                <ul class="playlist-list" id="playlistList" role="list">
                    <!-- dynamically generated -->
                </ul>
            </aside>

            <!-- Recently Played (mini) -->
            <aside class="recently-played" id="recentlyPlayed" aria-label="اخیراً پخش شده">
                <span class="recent-title">🕒 اخیراً</span>
                <ul class="recent-list" id="recentList" role="list"></ul>
            </aside>
        </main>

        <!-- Mini Player (floating) -->
        <div class="mini-player" id="miniPlayer" role="complementary" aria-label="پلیر کوچک">
            <div class="mini-info">
                <img id="miniCover" src="covers/c.png" alt="جلد" loading="lazy" />
                <div>
                    <span class="mini-title" id="miniTitle">عنوان</span>
                    <span class="mini-artist" id="miniArtist">خواننده</span>
                </div>
            </div>
            <div class="mini-controls">
                <button id="miniPlayBtn" aria-label="پخش">▶</button>
                <button id="miniNextBtn" aria-label="بعدی">⏭</button>
                <button id="miniExpandBtn" aria-label="بزرگ‌نمایی">⤢</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="script.js"></script>
</body>
</html>
