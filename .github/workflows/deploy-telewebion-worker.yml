name: deploy-telewebion-worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "telewebion-worker/index.js"
      - "telewebion-worker/wrangler.toml"
      - ".github/workflows/deploy-telewebion-worker.yml"

permissions:
  contents: read

concurrency:
  group: deploy-telewebion-worker
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    name: Deploy Naghme radio and IPTV proxy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy existing Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: telewebion-worker
          command: deploy
