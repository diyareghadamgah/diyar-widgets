name: Update Naghme Persian IPTV source

on:
  push:
    paths:
      - 'naghme/scripts/build-nexa-iptv.py'
      - '.github/workflows/naghme-nexa-playlist.yml'
  schedule:
    - cron: '20 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install requests
      - name: Build Persian playlist
        run: python naghme/scripts/build-nexa-iptv.py
      - name: Commit playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add naghme/sources/nexa-persian.m3u
          if ! git diff --cached --quiet; then
            git commit -m "Update Naghme Persian IPTV playlist"
            git push
          else
            echo "Playlist is already up to date."
          fi
