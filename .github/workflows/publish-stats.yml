name: Publish Visitor Stats

# ==============================================================================
# Reads the live aggregate from the Cloudflare Worker (worker/) and commits it
# to visitor/stats.json — the exact file GitHub Pages serves and the Blogfa
# template's embedded widget reads.
#
# `online` is intentionally NOT used to decide whether a commit is needed.
# Live online status should be read directly from the Worker's /online endpoint.
# ==============================================================================

"on":
  schedule:
    # Every 10 minutes. GitHub scheduled workflows are best-effort.
    - cron: '*/10 * * * *'

  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: publish-stats
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch aggregated stats from the Cloudflare Worker
        env:
          PUBLISH_SECRET: ${{ secrets.DIYAR_PUBLISH_SECRET }}
          WORKER_URL: ${{ secrets.DIYAR_WORKER_URL }}
        run: |
          set -euo pipefail

          curl -sf \
            -H "X-Publish-Secret: ${PUBLISH_SECRET}" \
            "${WORKER_URL}/aggregate" \
            -o /tmp/new-stats.json

          echo "Fetched aggregate from the Worker:"
          cat /tmp/new-stats.json

      - name: Validate fetched aggregate
        run: |
          node -e "
            const fs = require('fs');

            const stats = JSON.parse(
              fs.readFileSync('/tmp/new-stats.json', 'utf8')
            );

            const requiredKeys = [
              'today',
              'yesterday',
              'week',
              'month',
              'total',
              'online',
              'updatedAt'
            ];

            for (const key of requiredKeys) {
              if (!(key in stats)) {
                throw new Error('Missing required key: ' + key);
              }
            }

            console.log(
              'Fetched aggregate is valid JSON with the expected shape.'
            );
          "

      - name: Update visitor/stats.json only when real statistics changed
        run: |
          node -e "
            const fs = require('fs');

            // These five values represent the persistent visitor statistics.
            // `online` is deliberately excluded because it is live data and
            // must not create a Git commit every time its value changes.
            const STAT_KEYS = [
              'today',
              'yesterday',
              'week',
              'month',
              'total'
            ];

            const newStats = JSON.parse(
              fs.readFileSync('/tmp/new-stats.json', 'utf8')
            );

            let oldStats = null;

            try {
              oldStats = JSON.parse(
                fs.readFileSync('visitor/stats.json', 'utf8')
              );
            } catch (error) {
              oldStats = null;
            }

            const changed =
              !oldStats ||
              STAT_KEYS.some(
                (key) =>
                  Number(oldStats[key]) !== Number(newStats[key])
              );

            if (changed) {
              console.log(
                'At least one persistent visitor statistic changed.'
              );

              console.log(
                'Writing new stats.json with fresh updatedAt.'
              );

              fs.writeFileSync(
                'visitor/stats.json',
                JSON.stringify(newStats, null, 2) + '\\n'
              );
            } else {
              console.log(
                'None of the 5 persistent visitor statistics changed.'
              );

              console.log(
                'Leaving visitor/stats.json untouched.'
              );

              console.log(
                'Existing updatedAt is preserved.'
              );

              console.log(
                'Current online value is intentionally ignored for commits.'
              );
            }
          "

      - name: Commit and push if visitor/stats.json changed
        run: |
          set -euo pipefail

          git config user.name "diyar-stats-bot"
          git config user.email "actions@users.noreply.github.com"

          git add visitor/stats.json

          if git diff --cached --quiet; then
            echo "No persistent visitor-stat change — nothing to commit."
          else
            git commit -m "chore: update visitor stats.json"
            git push
          fi
