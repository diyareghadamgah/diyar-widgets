name: naghme-android
on:
  workflow_dispatch:
  push:
    paths:
      - 'naghme/**'
      - '.github/workflows/naghme-android.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: naghme
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2.1
          cache-disabled: true

      - name: Clean stale build leftovers
        run: rm -rf android www node_modules package-lock.json

      - name: Install dependencies
        run: npm install
        
      - name: Build web assets
        run: |
          node --check video.js
          node --check iptv-native.js
          node --check native-player.js
          node scripts/build-web.js
        
      - name: Add Android platform
        run: npx cap add android
        
      - name: Apply Naghme native setup
        run: node scripts/setup-android.js
        
      - name: Sync Capacitor
        run: npx cap sync android
        
      - name: Build debug APK
        run: |
          cd android
          gradle assembleDebug --stacktrace --no-daemon
          
      - name: Verify APK contains the plugin and current web assets
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          rm -rf /tmp/apk
          mkdir /tmp/apk
          unzip -q "$APK" -d /tmp/apk
          echo "== web assets inside APK =="
          ls /tmp/apk/assets/public
          test -f /tmp/apk/assets/public/video.js
          grep -q "کتابخانهٔ ویدئو" /tmp/apk/assets/public/video.js
          cat /tmp/apk/assets/public/build-info.json; echo
          grep -q "NaghmeStorage_not_registered" /tmp/apk/assets/public/platform.js
          grep -q "nativePromise" /tmp/apk/assets/public/platform.js
          echo "== dex contains plugin + MainActivity =="
          grep -l -a "ir/diyareghadamgah/naghme/NaghmeStoragePlugin" /tmp/apk/classes*.dex
          grep -l -a "ir/diyareghadamgah/naghme/NaghmeVideoPlayerPlugin" /tmp/apk/classes*.dex
          grep -l -a "ir/diyareghadamgah/naghme/NaghmeLibraryVideoPlayerPlugin" /tmp/apk/classes*.dex
          grep -l -a "ir/diyareghadamgah/naghme/MainActivity" /tmp/apk/classes*.dex
          echo "== verify native IPTV bridge in packaged app.js =="
          grep -q "window.IPTV=IPTV" /tmp/apk/assets/public/app.js
          grep -q "NaghmeNativeIPTV" /tmp/apk/assets/public/app.js
          test -f /tmp/apk/assets/public/iptv-native.js
          grep -q "native bridge ready" /tmp/apk/assets/public/iptv-native.js
          grep -q "NaghmeLibraryVideoPlayer" /tmp/apk/assets/public/native-player.js
          grep -q "پخش بومی Media3 فعال شد" /tmp/apk/assets/public/video.js
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: naghme-debug-apk
          path: naghme/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: naghme-build-reports
          path: naghme/android/app/build/reports
          if-no-files-found: ignore
