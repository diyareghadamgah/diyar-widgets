name: naghme-android
on:
  workflow_dispatch:
  push:
    paths:
      - 'naghme/**'
      - '.github/workflows/naghme-android.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: naghme
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
        
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2.1
          cache-disabled: true
          
      - name: Clean stale build leftovers
        run: rm -rf android www node_modules package-lock.json
        
      - name: Install dependencies
        run: npm install
        
      - name: Build web assets
        run: node scripts/build-web.js
        
      - name: Add Android platform
        run: npx cap add android
        
      - name: Apply Naghme native setup
        run: node scripts/setup-android.js
        
      - name: Sync Capacitor
        run: npx cap sync android
        
      - name: Build debug APK
        run: |
          cd android
          gradle assembleDebug --stacktrace --no-daemon
          
      - name: Verify APK
        run: |
          cd android/app/build/outputs/apk/debug
          unzip -l app-debug.apk | grep -q "assets/public/platform.js" || (echo "::error::platform.js not found in APK" && exit 1)
          unzip -l app-debug.apk | grep -q "classes.dex" || (echo "::error::Java classes not found in APK" && exit 1)
          echo "✅ APK verification passed. Files are in place."
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: naghme-debug-apk
          path: naghme/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
