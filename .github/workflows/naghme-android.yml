name: naghme-android
on:
  workflow_dispatch:
  push:
    paths:
      - 'naghme/**'
env:
  PROJECT_DIR: naghme
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: naghme
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies
        run: npm install
      - name: Build web assets
        run: node scripts/build-web.js
      - name: Add Android platform
        run: |
          if [ ! -d android ]; then npx cap add android; fi
      - name: Setup Android (Plugins & Permissions)
        run: node scripts/setup-android.js
      - name: Sync Capacitor (Crucial for Plugins)
        run: npx cap sync android
      - name: Make gradlew executable
        run: chmod +x android/gradlew
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: naghme-debug-apk
          path: naghme/android/app/build/outputs/apk/debug/app-debug.apk
