# ساخت APK دیباگ نغمه روی GitHub Actions (برای زمانی که کامپیوتر/Android Studio ندارید).
# نصب: این فایل را در «ریشه‌ی مخزن» با مسیر .github/workflows/naghme-android.yml بگذارید.
# اگر پروژه در زیرپوشه‌ی دیگری است، مقدار PROJECT_DIR را عوض کنید.
# توجه: این فایل در محیط تولید پروژه قابل اجرا نبود و آزمایش نشده است.
name: naghme-android
on:
  workflow_dispatch:
  push:
    paths: ['naghme/**']
env:
  PROJECT_DIR: naghme
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: node scripts/build-web.js
      - name: افزودن پلتفرم اندروید (اگر پوشه‌ی android در مخزن نیست)
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          node scripts/setup-android.js
          npx cap sync android
      - run: chmod +x android/gradlew
      - run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: naghme-debug-apk
          path: naghme/android/app/build/outputs/apk/debug/app-debug.apk
