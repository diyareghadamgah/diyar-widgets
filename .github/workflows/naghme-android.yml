name: naghme-android
on:
  workflow_dispatch:
  push:
    paths:
      - 'naghme/**'
      - '.github/workflows/naghme-android.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: naghme
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        
      - name: Clean stale build leftovers
        run: rm -rf android www node_modules package-lock.json
        
      - name: Install dependencies
        run: npm install
        
      - name: Build web assets
        run: node scripts/build-web.js
        
      - name: Add Android platform
        run: npx cap add android
        
      - name: Apply Naghme native setup
        run: node scripts/setup-android.js
        
      - name: Sync Capacitor
        run: npx cap sync android
        
      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: naghme-debug-apk
          path: naghme/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: naghme-build-reports
          path: naghme/android/app/build/reports
          if-no-files-found: ignore
