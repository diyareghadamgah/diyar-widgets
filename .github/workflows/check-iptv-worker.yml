name: Check IPTV Worker

on:
  pull_request:
    paths:
      - "telewebion-worker/index.js"
      - "telewebion-worker/wrangler.toml"
      - ".github/workflows/check-iptv-worker.yml"

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check Worker JavaScript syntax
        run: node --check telewebion-worker/index.js
