<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>نغمه | NAGHME MUSIC STUDIO</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0b0b0b"><link rel="icon" href="favicon.png"><link rel="apple-touch-icon" href="icon-192.png"><link rel="stylesheet" href="style.css"></head><body>
<aside id="side"><h1><img src="icon-192.png" alt="دیار قدمگاه" class="logo">نغمه<small>NAGHME MUSIC STUDIO</small></h1><nav id="nav"></nav></aside>
<main>
<div id="modeBar" class="mode-switchbar" hidden>
 <button id="modeBack" type="button" class="btn-sm mode-home-btn">☰ بخش‌ها</button>
 <strong id="modeTitle">نغمه</strong>
 <div class="mode-switch-actions">
  <button type="button" class="btn-sm" data-mode="music" aria-label="رفتن به موزیک">🎵</button>
  <button type="button" class="btn-sm" data-mode="video" aria-label="رفتن به ویدئو">🎬</button>
  <button type="button" class="btn-sm" data-mode="tv" aria-label="رفتن به تلویزیون">📺</button>
 </div>
</div>
<section id="modeHome" aria-label="انتخاب بخش"><div class="mode-welcome"><img src="icon-192.png" alt=""><h1>نغمه</h1><p>از کدام بخش می‌خواهید استفاده کنید؟</p></div><div class="mode-cards"><button type="button" data-mode="music"><span>🎵</span><b>موزیک</b><small>کتابخانه و پخش آهنگ‌ها</small></button><button type="button" data-mode="video"><span>🎬</span><b>ویدئو</b><small>کتابخانه و پخش ویدئوها</small></button><button type="button" data-mode="tv"><span>📺</span><b>تلویزیون</b><small>شبکه‌های تلویزیونی اینترنتی</small></button></div></section><header><<input id="q" type="search" placeholder="جست‌وجو: آهنگ، خواننده، آلبوم، پوشه، سال، سبک، فرمت…"><button id="add" class="pri">＋ افزودن</button><button id="theme" title="تم" aria-label="تغییر تم">◐</button></header><div id="view"></div>
<section id="tvpage" hidden aria-label="تلویزیون اینترنتی">
<div class="tv-topbar"><strong>📺 تلویزیون اینترنتی</strong><button id="tvHeaderRefresh" type="button" class="btn-sm" data-a="iptvload" aria-label="دریافت دوباره فهرست" title="دریافت دوباره فهرست">↻</button></div>
<div class="tvplayer">
 <div class="tvbox" id="tvbox"><video id="iptvVideo" controls playsinline webkit-playsinline preload="none" hidden></video><div class="tvph" id="tvph">📺<br>برای شروع، یک شبکه را انتخاب کنید<small>پخش زنده به فعال‌بودن سرور شبکه و پشتیبانی دستگاه از فرمت آن بستگی دارد</small></div><button id="tvfsx" class="tvfsx" data-a="iptvfsx" aria-label="خروج از تمام‌صفحه" hidden>✕</button></div>
 <div class="tvnow"><div class="m"><b id="tvName">شبکه‌ای انتخاب نشده</b><span id="tvGroup"></span></div><button id="tvRetry" class="btn-sm" data-a="iptvretry" aria-label="اتصال دوباره" disabled>↻</button><label class="iptv-quality-label" for="iptvQuality">کیفیت <select id="iptvQuality" aria-label="انتخاب کیفیت پخش"><option value="0">خودکار</option><option value="240">۲۴۰p</option><option value="360">۳۶۰p</option><option value="480">۴۸۰p</option><option value="720">۷۲۰p</option><option value="1080">۱۰۸۰p</option></select></label><button id="tvFs" class="btn-sm" data-a="iptvfs" aria-label="تمام‌صفحه" disabled>⛶</button></div>
 <p id="iptvStatus" class="tvstatus" aria-live="polite"></p>
</div>
<div class="tvbrowse">
 <div class="tvhead"><span id="tvCount" class="d"></span><button type="button" class="btn-sm" data-a="iptvurl" aria-label="مدیریت فهرست M3U" title="مدیریت فهرست M3U">⚙ مدیریت فهرست</button><button id="iptvFileBtn" type="button" class="btn-sm" data-a="iptvfile" title="بارگذاری فهرست از فایل گوشی" hidden>＋ M3U</button><button type="button" class="btn-sm" data-a="famopen" title="شبکه‌های رسمی فام">📡 فام</button></div>
 <p id="tvMsg" class="tvmsg d" hidden></p>
 <div class="iptv-country-panel"><div class="iptv-country-head"><b>🌍 کشورها</b><strong id="iptvCountryTotals">۰ کشور • ۰ شبکه</strong><span id="iptvCountrySelectionCount">نمایش همه کشورها</span></div><input id="iptvCountrySearch" class="iptv-country-search" type="search" placeholder="جست‌وجوی کشور؛ ایران، آمریکا، شوروی…" autocomplete="off" aria-label="جست‌وجوی کشورها"><div id="iptvCountries" class="iptv-countries"></div></div>
 <div class="iptv-search-wrap"><input id="iptvSearch" class="iptv-search" type="search" placeholder="🔎 جست‌وجوی نام شبکه، کشور یا زبان…" autocomplete="off" enterkeyhint="search" aria-label="جست‌وجوی شبکه‌های تلویزیونی"></div>
 <div class="chips" id="tvChips"></div>
 <div id="iptvResults" class="tvlist"></div>
</div>
</section><section id="videoPage" hidden aria-label="کتابخانه ویدئو" style="flex-direction:column;height:100%"><div id="videoContent"></div></section>
</main>
<div id="mini"><div id="mc" data-a="np"></div><div class="m" data-a="np"><b id="mt">—</b><span id="ma"></span></div><button data-a="prev" aria-label="قبلی">⏮</button><button data-a="tog" class="pt pri" aria-label="پخش/توقف">▶</button><button data-a="next" aria-label="بعدی">⏭</button><i id="mp"></i></div>
<section id="np" hidden><button class="ib" data-a="npx" aria-label="بستن">✕</button><div id="nc"></div><h2 id="nt"></h2><p id="na"></p><input id="seek" type="range" min="0" max="1000" value="0"><div class="tm"><span id="te">۰:۰۰</span><span id="tr">۰:۰۰</span></div>
<div class="ctl"><button data-a="shuf" id="bs">⤮</button><button data-a="prev">⏮</button><button data-a="tog" class="pt pri big">▶</button><button data-a="next">⏭</button><button data-a="rep" id="br">⟳</button></div>
<div class="ctl"><button data-a="b10">⏪ ۱۰</button><button data-a="mute" id="bm">🔊</button><input id="vol" type="range" min="0" max="1" step="0.01" value="1"><button data-a="f10">۱۰ ⏩</button></div><h3>صف پخش</h3><div id="qu"></div></section>
<dialog id="dlg"></dialog><div id="toast"></div>
<input type="file" id="fDir" webkitdirectory multiple hidden><input type="file" id="fFiles" accept="audio/*,.mp3,.m4a,.flac,.ogg,.opus,.wav,.aac,.wma" multiple hidden><input type="file" id="fImg" accept="image/*" hidden><input type="file" id="fJson" accept=".json" hidden><input type="file" id="videoFiles" accept="video/*,.mkv,.avi,.ts,.3gp" multiple hidden><input type="file" id="videoFolder" accept="video/*,.mkv,.avi,.ts,.3gp" webkitdirectory directory multiple hidden><input type="file" id="subtitleFile" accept=".srt,.vtt,text/vtt,application/x-subrip" hidden><input type="file" id="iptvFile" accept=".m3u,.m3u8,text/plain" hidden>
